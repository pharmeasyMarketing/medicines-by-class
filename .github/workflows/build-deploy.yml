name: Build and deploy Medicines by Class

# ONE run does everything: read the sheet once, price once, then emit both
# outputs from that same data —
#   * production build  -> repo medicines-by-class/  (+ optional CyberPanel rsync)
#   * preview build     -> GitHub Pages
# Two separate workflows meant two sheet reads and two snapshots that could
# disagree with each other.

on:
  schedule:
    - cron: "30 20 * * *"        # 02:00 IST nightly
  repository_dispatch:
    types: [sheet-updated]        # fired by the Apps Script on sheet edit
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "assets/**", "sheets/**", ".github/workflows/build-deploy.yml"]

permissions:
  contents: write        # commit the build back into the repo
  pages: write
  id-token: write

concurrency:
  group: mbc-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      # build.mjs shells out to make_og.py for the share cards. It warns and
      # carries on without Pillow, so a missing install would quietly ship
      # pages whose og:image 404s.
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet "Pillow>=10"

      # ---- 1. the sheet is the source of truth -------------------------
      - name: Fetch sheet tabs
        env:
          SHEET_ID: ${{ vars.SHEET_ID || secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node src/fetch-sheets.mjs

      - name: Validate sheets
        run: node src/validate.mjs

      # ---- 2. one snapshot, shared by both builds ----------------------
      - name: Snapshot prices
        env:
          PRICE_API: ${{ secrets.PRICE_API_TEMPLATE || 'https://api.pharmeasy.in/v5/product-details/{id}/dynamic' }}
        run: node src/snapshot.mjs --concurrency 10

      # ---- 3. production build ------------------------------------------
      - name: Build (production)
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://pharmeasy.in' }}
          SITE_BASE:   ${{ vars.SITE_BASE   || '/medicines-by-class' }}
          ASSET_BASE:  ${{ vars.ASSET_BASE  || '/medicines-by-class/assets' }}
          PRICE_API:   ${{ vars.PUBLIC_PRICE_API || 'https://api.pharmeasy.in/v5/product-details/{id}/dynamic' }}
        run: node src/build.mjs

      - name: Diff against last deploy
        id: diff
        run: |
          set -euo pipefail
          if [ -f .deploy-manifest.json ]; then
            changed=$(node -e '
              const a=require("./.deploy-manifest.json"), b=require("./dist/manifest.json");
              const keys=new Set([...Object.keys(a),...Object.keys(b)]);
              console.log([...keys].filter(k=>a[k]!==b[k]).length);
            ')
          else
            changed=all
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "pages changed: $changed"

      - name: Deploy to CyberPanel
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST:    ${{ secrets.DEPLOY_HOST }}
          USER:    ${{ secrets.DEPLOY_USER }}
          DEST:    ${{ secrets.DEPLOY_PATH }}
          KNOWN:   ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          PORT:    ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          # Optional target. Without the secrets there is nothing to rsync to,
          # and failing here would skip everything that follows.
          if [ -z "${HOST:-}" ] || [ -z "${USER:-}" ] || [ -z "${DEST:-}" ]; then
            echo "DEPLOY_* secrets not set — skipping rsync (build still published to the repo)"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          rsync -az --delete --exclude 'manifest.json' \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${PORT:-22}" dist/ "$USER@$HOST:$DEST/"

      - name: Publish build into medicines-by-class/
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # dist/ is a pure artifact, so on a rejected push we can just reset to
          # whatever landed and lay it down again. Committing first and then
          # rebasing would try to merge generated output against generated
          # output — a push arriving mid-run used to fail the whole workflow.
          for attempt in 1 2 3; do
            rm -rf medicines-by-class && mkdir -p medicines-by-class
            cp -R dist/. medicines-by-class/
            cp dist/manifest.json .deploy-manifest.json
            git add -f medicines-by-class .deploy-manifest.json sheets/
            if git diff --staged --quiet; then
              echo "nothing changed"; break
            fi
            git commit -m "build: ${{ steps.diff.outputs.changed }} page(s) changed [skip ci]"
            if git push; then
              echo "published on attempt $attempt"; break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::could not publish after 3 attempts"; exit 1
            fi
            echo "push rejected — resyncing and retrying"
            git fetch origin main
            git reset --hard origin/main
          done

      # ---- 4. preview build, from the SAME sheet + snapshot -------------
      - name: Build (GitHub Pages preview)
        env:
          SITE_ORIGIN: https://pharmeasymarketing.github.io
          SITE_BASE:   /medicines-by-class
          ASSET_BASE:  /medicines-by-class/assets
        run: |
          set -euo pipefail
          node src/build.mjs
          # the repo is NAMED medicines-by-class, so Pages already serves it
          # at that path — nesting again would double it
          rm -rf _site && mkdir -p _site
          cp -R dist/. _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
